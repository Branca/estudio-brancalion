<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100"
     style="font-family: system-ui, sans-serif;">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1c1040"/>
      <stop offset="100%" stop-color="#07060f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- fundo -->
  <rect width="800" height="1100" fill="url(#bg)"/>
  <rect width="800" height="1100" fill="url(#grid)"/>

  <!-- moldura -->
  <rect x="20" y="20" width="760" height="1060" fill="none"
        stroke="rgba(201,169,78,0.25)" stroke-width="2" rx="4"/>

  <!-- ícone central -->
  <g transform="translate(400, 520)" fill="none" stroke="rgba(201,169,78,0.35)" stroke-width="3">
    <rect x="-80" y="-100" width="160" height="200" rx="6"/>
    <line x1="-60" y1="-60" x2="60" y2="-60"/>
    <line x1="-60" y1="-30" x2="40" y2="-30"/>
    <line x1="-60" y1="0"   x2="50" y2="0"/>
    <line x1="-60" y1="30"  x2="30" y2="30"/>
    <circle cx="40" cy="60" r="28" stroke="rgba(201,169,78,0.5)"/>
    <path d="M 28 60 L 44 72 L 60 48" stroke="rgba(201,169,78,0.5)" stroke-width="3.5" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- label -->
  <text x="400" y="680" text-anchor="middle"
        fill="rgba(255,255,255,0.18)" font-size="14" letter-spacing="6">
    SUBSTITUIR PELA ARTE FINAL
  </text>
  <text x="400" y="705" text-anchor="middle"
        fill="rgba(255,255,255,0.1)" font-size="11" letter-spacing="3">
    800 × 1100 px recomendado
  </text>
</svg>
